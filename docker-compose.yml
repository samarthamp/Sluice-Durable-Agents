# Redis Streams for the alert ingest (3.2).
#
#   docker compose up -d                 # from the repo root
#   sluice producer --demo --count 1
#   sluice orchestrator --once --narrate
#
# Optional: `sluice demo` never needs it, and the orchestrator falls back to an
# in-process queue if Redis is unreachable, and says so on stdout.
#
# Keep this file at the repo root. container_name is pinned, and compose names the
# project after this file's directory: moved elsewhere, `up` refuses the existing
# container as belonging to another project (see docs/wsl-docker.md).

services:
  redis:
    image: redis:7-alpine
    container_name: sluice-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
