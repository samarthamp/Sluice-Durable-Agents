[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sluice"
version = "1.0.0"
description = "Divergence-safe durable execution for agent decisioning"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["durable-execution", "sagas", "distributed-systems", "agents", "exactly-once"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: System :: Distributed Computing",
]
# The core (journal, branch tree, barrier, compensation, EEO checker, InProcessWorld)
# is standard library only, so the demo cannot be taken out by a failed install.
dependencies = []

[project.optional-dependencies]
# The HTTP topology: effect services, ledger service, HttpWorld, dashboard.
# Plain uvicorn, deliberately not uvicorn[standard]: its uvloop/httptools extras need a
# C toolchain on some platforms and buy throughput this project does not need.
http = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.29,<1.0",
    "pydantic>=2.5,<3.0",
    "httpx>=0.27,<1.0",
]
# Redis Streams ingest. Optional: without it the in-process queue is used.
redis = ["redis>=5.0,<7.0"]
all = ["sluice[http,redis]"]
dev = [
    "sluice[http,redis]",
    "pytest>=8.0,<9.0",
    "ruff>=0.6",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
sluice = "sluice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sluice.dashboard" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets the suite run straight from a checkout, installed or not.
pythonpath = ["src"]
addopts = "-ra --strict-markers"
# An exception in a background thread must fail the test that caused it, not scroll by
# as a warning: that is how a race in the shared journal once stayed hidden.
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
    # Starlette >= 1.x is moving its TestClient off httpx; the code under test is not.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "http: needs the HTTP extras (fastapi, uvicorn, httpx); skipped without them",
    "redis: needs a reachable Redis (REDIS_URL); skipped without one",
    "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "UP037",  # quoted annotations are kept where they document a forward reference
]

[tool.ruff.lint.isort]
known-first-party = ["sluice"]
